  push:
    branches:
      - main
env:
   IMAGE_TAG: ${{ github.sha }}

jobs:

  # validate:
  #   name: Validate Parameters
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Validate Docker Tags
  #       run: |
  #         if [ -z "${{ inputs.FRONTEND_DOCKER_TAG }}" ]; then
  #           echo "Frontend Docker tag is required"
  #           exit 1
  #         fi

  #         if [ -z "${{ inputs.BACKEND_DOCKER_TAG }}" ]; then
  #           echo "Backend Docker tag is required"
  #           exit 1
  #         fi

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build Backend
      - name: Build Backend Docker Image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t aliahmadshah/mern-ecommerce-backend:${IMAGE_TAG} \
            .

      # 5. Build Frontend
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t aliahmadshah/mern-ecommerce-frontend:${IMAGE_TAG} \
            ./frontend

      # 6. Push Backend
      - name: Push Backend Docker Image
        run: |
          docker push \
            aliahmadshah/mern-ecommerce-backend:${IMAGE_TAG}

      # 7. Push Frontend
      - name: Push Frontend Docker Image
        run: |
          docker push \
            aliahmadshah/mern-ecommerce-frontend:${IMAGE_TAG}


      # 8. Show generated images
      - name: Docker Images
        run: |
          docker images | grep mern-ecommerce
