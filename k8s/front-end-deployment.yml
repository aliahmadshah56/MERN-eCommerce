apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mern
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: aliahmadshah/mern-ecommerce-frontend:f479a4c711ae3437bd83a67928c0efe9f4d02829
          ports:
            - containerPort: 80

